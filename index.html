<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
<meta name="theme-color" content="#0B0C0E">
<title>Kings & Chaos</title>
<link rel="preload" href="Michroma-Regular.ttf" as="font" type="font/ttf" crossorigin>
<!--
  The web build's page, in place of Godot's own (logo and a plain progress
  bar). While the game downloads it shows the loading screen that
  scripts/ui/splash.gd draws on the other platforms: same 390x844 design box,
  same numbers and timings. Keep the two in step.
  Everything shows at once, as soon as the font has loaded (so no text pops in
  late). The bar fills over 3.5 s, or longer if the game is still loading;
  the game says when it's ready (kcLoader.ready(), from Splash). Then the puck
  is crowned for 0.5 s and it fades onto the title.
-->
<style>
@font-face {
	font-family: "Michroma";
	src: url("Michroma-Regular.ttf") format("truetype");
	font-display: block;
}
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { background: #0B0C0E; color: #E6E7EA; overflow: hidden; touch-action: none; }
#canvas { display: block; }
#canvas:focus { outline: none; }

#kc {
	position: fixed; inset: 0; z-index: 10; overflow: hidden;
	background: radial-gradient(ellipse 75% 75% at 50% 38%, #1A1C21, #0B0C0E);
	font-family: "Michroma", sans-serif; user-select: none; -webkit-user-select: none;
	transition: opacity 0.4s ease;
}
#kc.out { opacity: 0; pointer-events: none; }
#kc-stage { visibility: hidden; }
#kc.shown #kc-stage { visibility: visible; }
#kc-stage {
	position: absolute; left: 50%; top: 50%; width: 390px; height: 844px;
	transform: translate(-50%, -50%) scale(var(--s, 1));
}
#kc-stage > * { position: absolute; }

/* the faint board behind everything, fading out around the mark */
.kc-checker {
	left: -1000px; top: -1000px; width: 2390px; height: 2844px;
	/* squares line up on the mark's centre (195, 408 in the box) like Splash's */
	background: repeating-conic-gradient(rgba(59, 62, 68, 0.10) 0 25%, transparent 0 50%) 1195px 1408px / 96px 96px;
	-webkit-mask-image: radial-gradient(circle 464px at 1195px 1408px, #000 0, transparent 100%);
	mask-image: radial-gradient(circle 464px at 1195px 1408px, #000 0, transparent 100%);
}

.kc-mote { left: 0; top: 0; border-radius: 50%; opacity: 0; animation: kc-rise linear infinite; }
@keyframes kc-rise {
	0% { transform: translate(var(--x), 844px); opacity: 0; }
	50% { opacity: 0.8; }
	100% { transform: translate(var(--x), 0); opacity: 0; }
}

.kc-text {
	left: 0; width: 390px; text-align: center; line-height: 1; white-space: nowrap;
	transform: translateY(-50%);
}
#kc-studio { top: 150px; font-size: 11px; letter-spacing: 4px; text-indent: 4px; color: #8A8D93; }
#kc-presents { top: 172px; font-size: 9px; letter-spacing: 5px; text-indent: 5px; color: #55585E; }

.kc-glow {
	left: 45px; top: 168px; width: 300px; height: 300px; border-radius: 50%;
	background: radial-gradient(circle, rgba(240, 138, 36, 0.22), rgba(240, 138, 36, 0) 70%);
	animation: kc-breathe 2.86s ease-in-out infinite;
}
@keyframes kc-breathe { 50% { transform: scale(1.08); } }
#kc-mark {
	left: 111px; top: 234px; width: 168px; height: 168px;
}

#kc-kings { top: 468px; font-size: 34px; letter-spacing: 10px; text-indent: 10px; color: #FFC94D; }
.kc-rule { top: 505px; height: 1.5px; width: 86px; background: rgba(240, 138, 36, 0.6); }
#kc-rule-l { left: 85px; transform-origin: right; }
#kc-rule-r { left: 219px; transform-origin: left; }
#kc-crown { left: 180px; top: 496.25px; width: 30px; height: 19.5px; }

#kc-chaos { top: 546px; font-size: 34px; letter-spacing: 10px; text-indent: 10px; color: #E6E7EA; }
#kc-chaos::before, #kc-chaos::after {
	content: "CHAOS"; position: absolute; left: 0; top: 0; width: 100%; z-index: -1;
}
#kc-chaos::before { color: #2E9BFF; transform: translateX(-2.55px); }
#kc-chaos::after { color: #F08A24; transform: translateX(2.55px); }
#kc-chaos { isolation: isolate; }

#kc-tag { top: 596px; font-size: 10px; letter-spacing: 5px; text-indent: 5px; color: #8A8D93; }

/* the loading bar: one row of the board, an Orange puck crossing it */
#kc-bar { left: 83px; top: 702px; width: 224px; height: 28px; }
#kc-bar .frame {
	position: absolute; inset: -5px; border: 1px solid #34373D; border-radius: 7px; background: #0D0E10;
}
#kc-bar .squares { position: absolute; inset: 0; display: flex; }
#kc-bar .squares i { width: 28px; height: 28px; background: #1E2024; }
#kc-bar .squares i:nth-child(odd) { background: #3B3E44; }
#kc-bar .lit {
	position: absolute; left: 0; top: 0; height: 28px; background: rgba(240, 138, 36, 0.16);
	width: calc(14px + var(--p, 0) * 196px);
}
#kc-bar .inlay {
	position: absolute; left: 0; top: 30px; height: 1.5px; background: rgba(240, 138, 36, 0.9);
	width: calc(14px + var(--p, 0) * 196px);
}
#kc-bar .puck {
	position: absolute; top: 14px; left: calc(14px + var(--p, 0) * 196px); width: 0; height: 0;
}
#kc-bar .puck > * { position: absolute; border-radius: 50%; transform: translate(-50%, -50%); }
#kc-bar .halo { width: 34px; height: 34px; background: rgba(240, 138, 36, 0.18); transition: background 0.35s; }
#kc-bar .body {
	width: 15.5px; height: 15.5px; background: #65584B; border: 2.5px solid #F08A24;
	box-shadow: 0 0 0 1.25px #51463C; transition: border-color 0.35s;
}
#kc-bar .flash { width: 20px; height: 20px; border: 2px solid #FFC94D; opacity: 0; }
#kc-bar .king { width: 18px; height: 11.7px; border-radius: 0; left: 0; top: -20px; transform: translate(-50%, -50%) scale(0); }
#kc.crowned #kc-bar .halo { background: rgba(255, 201, 77, 0.18); }
#kc.crowned #kc-bar .body { border-color: #FFC94D; }
#kc.crowned #kc-bar .flash { animation: kc-flash 0.35s ease-out forwards; }
#kc.crowned #kc-bar .king { animation: kc-king 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
@keyframes kc-flash {
	from { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
	to { opacity: 0; transform: translate(-50%, -50%) scale(4.4); }
}
@keyframes kc-king { to { transform: translate(-50%, -50%) scale(1); } }

#kc-flavor { top: 760px; font-size: 8px; letter-spacing: 3px; text-indent: 3px; color: #55585E; }
#kc-notice {
	left: 32px; right: 32px; top: 640px; display: none; padding: 14px; border-radius: 12px;
	background: #16171B; border: 1px solid #FF4D6A; color: #E6E7EA; text-align: center;
	font: 13px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif;
}
#kc.failed #kc-notice { display: block; }
#kc.failed #kc-bar, #kc.failed #kc-flavor { display: none; }
</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KingsChaos">
<meta name="application-name" content="Kings &amp; Chaos">
<meta property="og:title" content="Kings &amp; Chaos: Power Checkers">
<meta name="description" content="Checkers, but every move is a gamble for power.">
<script>document.title = "Kings & Chaos";</script>
<script src="gabagool_push.js"></script>
<script src="gabagool_signin.js"></script>
</head>
<body>
<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
<noscript>Kings &amp; Chaos needs JavaScript.</noscript>

<div id="kc">
	<div id="kc-stage">
		<div class="kc-checker"></div>
		<div id="kc-motes"></div>
		<div id="kc-studio" class="kc-text">KILLER POTATOS WORLDWIDE</div>
		<div id="kc-presents" class="kc-text">PRESENTS</div>
		<div class="kc-glow"></div>
		<svg id="kc-mark" viewBox="0 0 200 200" aria-label="Kings &amp; Chaos">
			<circle cx="100" cy="112" r="84" fill="#F08A24" opacity="0.10"/>
			<path d="M170 92 L188 84 M174 108 L194 108 M26 98 L10 90 M28 118 L8 122" stroke="#FFC94D" stroke-width="4" stroke-linecap="round"/>
			<rect x="160" y="130" width="12" height="12" fill="#2E9BFF" transform="rotate(20 166 136)"/>
			<rect x="26" y="142" width="10" height="10" fill="#F08A24" transform="rotate(-25 31 147)"/>
			<rect x="150" y="170" width="8" height="8" fill="#FFC94D" transform="rotate(40 154 174)"/>
			<rect x="44" y="176" width="7" height="7" fill="#2E9BFF" transform="rotate(15 47 179)"/>
			<circle cx="100" cy="112" r="58" fill="#51463C" stroke="#F08A24" stroke-width="8"/>
			<circle cx="100" cy="112" r="34" fill="#65584B" stroke="#FFC94D" stroke-width="7"/>
			<path d="M104 80 L94 102 L110 112 L96 138 L104 152" fill="none" stroke="#121315" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
			<path d="M60 74 L66 36 L86 58 L100 26 L114 58 L134 36 L140 74 Z" fill="#FFC94D" stroke="#121315" stroke-width="5" stroke-linejoin="round"/>
			<circle cx="66" cy="36" r="6" fill="#F08A24"/>
			<circle cx="100" cy="26" r="7" fill="#E8ECF0"/>
			<circle cx="134" cy="36" r="6" fill="#2E9BFF"/>
		</svg>
		<div id="kc-kings" class="kc-text">KINGS</div>
		<div id="kc-rule-l" class="kc-rule"></div>
		<svg id="kc-crown" viewBox="0 0 100 65"><polygon fill="#F08A24" points="8,58.5 12,13 35,35.75 50,5.2 65,35.75 88,13 92,58.5"/></svg>
		<div id="kc-rule-r" class="kc-rule"></div>
		<div id="kc-chaos" class="kc-text">CHAOS</div>
		<div id="kc-tag" class="kc-text">// POWER CHECKERS</div>
		<div id="kc-bar">
			<div class="frame"></div>
			<div class="squares"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
			<div class="lit"></div>
			<div class="inlay"></div>
			<div class="puck">
				<div class="halo"></div>
				<div class="flash"></div>
				<div class="body"></div>
				<svg class="king" viewBox="0 0 100 65"><polygon fill="#FFC94D" points="8,58.5 12,13 35,35.75 50,5.2 65,35.75 88,13 92,58.5"/></svg>
			</div>
		</div>
		<div id="kc-flavor" class="kc-text">SETTING THE BOARD</div>
		<div id="kc-notice"></div>
	</div>
</div>

<script src="index.js"></script>
<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":2533032,"index.wasm":37695054},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const BAR_TIME = 3.5;     // the bar fills over this at least (Splash.BAR_TIME)
	const CROWN_TIME = 0.5;   // Splash.CROWN_TIME
	const FADE_TIME = 0.4;    // Splash.FADE_TIME
	const FLAVOR = ['SETTING THE BOARD', 'SCATTERING ORBS', 'ARMING THE BOMBS', 'POLISHING THE CROWNS'];
	// Splash.MOTES: x, speed, phase, size, colour
	const MOTES = [
		[40, 3.1, 0.10, 2.0, 0], [92, 2.2, 0.55, 1.5, 1], [150, 2.8, 0.80, 2.5, 0],
		[208, 1.9, 0.30, 1.5, 2], [262, 2.6, 0.65, 2.0, 0], [318, 3.4, 0.05, 1.5, 1],
		[352, 2.0, 0.42, 2.5, 0], [66, 2.4, 0.92, 1.5, 2], [122, 3.0, 0.20, 2.0, 0],
		[236, 2.3, 0.72, 2.0, 1], [290, 1.8, 0.88, 1.5, 0], [180, 2.7, 0.48, 1.5, 2],
	];
	const COLOURS = ['232, 236, 240', '240, 138, 36', '46, 155, 255'];

	const root = document.getElementById('kc');
	const stage = document.getElementById('kc-stage');
	const flavor = document.getElementById('kc-flavor');
	const notice = document.getElementById('kc-notice');
	let start = 0;            // when the screen showed (0: not yet)

	const motes = document.getElementById('kc-motes');
	MOTES.forEach(function (m) {
		const el = document.createElement('i');
		const period = 25 / m[1];
		const r = m[3];
		el.className = 'kc-mote';
		el.style.cssText = '--x:' + (m[0] - r * 3) + 'px;width:' + (r * 6) + 'px;height:' + (r * 6) + 'px;'
			+ 'background:radial-gradient(circle closest-side, rgb(' + COLOURS[m[4]] + ') 33%, rgba(' + COLOURS[m[4]] + ', 0.12) 36%, '
			+ 'rgba(' + COLOURS[m[4]] + ', 0.12) 99%, transparent 100%);'
			+ 'animation-duration:' + period + 's;animation-delay:' + (-m[2] * period) + 's;';
		motes.appendChild(el);
	});

	function fit() {
		const s = Math.min(window.innerWidth / 390, window.innerHeight / 844);
		stage.style.setProperty('--s', s);
	}
	fit();
	window.addEventListener('resize', fit);

	let target = 0;       // where the bar is heading
	let shown = 0;        // what it shows
	let downloaded = false;
	let ready = false;
	let crowned = 0;      // time it was crowned (0: not yet)
	let failed = false;
	let last = 0;

	function tick(now) {
		if (failed) {
			return;
		}
		const dt = Math.min((now - last) / 1000, 1 / 30);
		last = now;
		const t = (now - start) / 1000;
		let goal = target;
		if (downloaded && !ready) {
			// The download is done; the engine is starting. Creep towards 92%.
			target += (0.92 - target) * dt * 0.8;
			goal = target;
		}
		if (ready) {
			goal = 1;
		}
		goal = Math.min(goal, t / BAR_TIME);
		if (!ready) {
			goal = Math.min(goal, 0.95);
		}
		shown = Math.min(1, shown + Math.max(0, Math.min(goal - shown, dt * 1.5)));
		stage.style.setProperty('--p', shown);
		if (!crowned) {
			flavor.textContent = FLAVOR[Math.min(Math.floor(shown * FLAVOR.length), FLAVOR.length - 1)];
		}
		if (!crowned && shown >= 1) {
			crowned = now;
			flavor.textContent = 'READY';
			root.classList.add('crowned');
			setTimeout(function () {
				root.classList.add('out');
				setTimeout(function () { root.remove(); }, FADE_TIME * 1000);
			}, CROWN_TIME * 1000);
			return;
		}
		requestAnimationFrame(tick);
	}
	// Show everything at once, once the font is in (at most 1.5 s wait).
	function show() {
		if (start) {
			return;
		}
		root.classList.add('shown');
		start = last = performance.now();
		requestAnimationFrame(tick);
	}
	if (document.fonts && document.fonts.load) {
		document.fonts.load('10px Michroma').then(show, show);
		setTimeout(show, 1500);
	} else {
		show();
	}

	// Splash (in the game) calls this once the title is built and drawn.
	window.kcLoader = {
		ready: function () { ready = true; },
	};

	function fail(err) {
		console.error(err);
		let text = 'Something went wrong while loading.';
		if (err instanceof Error) {
			text = err.message;
		} else if (typeof err === 'string') {
			text = err;
		}
		notice.textContent = text;
		failed = true;
		root.classList.add('failed', 'shown');
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail('This browser is missing what the game needs to run:\n' + missing.join('\n'));
		return;
	}
	engine.startGame({
		onProgress: function (current, total) {
			if (current > 0 && total > 0) {
				target = Math.max(target, 0.8 * current / total);
				if (current >= total) {
					downloaded = true;
				}
			}
		},
	}).then(function () {
		downloaded = true;
		// An older game that never calls ready(): don't hide it forever.
		setTimeout(function () { ready = true; }, 10000);
	}, fail);
}());
</script>
</body>
</html>
